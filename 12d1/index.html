<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>12D1 | Thanh Xuân - Gửi Những Điều Đẹp Nhất</title>

<!-- FONT CHỮ ĐẸP -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;1,500&family=Dancing+Script:wght@500;600;700&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    overflow-x: hidden;
    font-family: 'Cormorant Garamond', serif;
    color: white;
    background:
        radial-gradient(ellipse at 50% 35%, #345b80 0%, transparent 55%),
        linear-gradient(135deg, #091629, #183653, #101d36);
}

/* ÁNH SAO */
.stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
        radial-gradient(2px 2px at 10% 20%, white, transparent),
        radial-gradient(2px 2px at 80% 30%, white, transparent),
        radial-gradient(3px 3px at 30% 75%, white, transparent),
        radial-gradient(2px 2px at 70% 85%, white, transparent),
        radial-gradient(2px 2px at 50% 10%, white, transparent),
        radial-gradient(2px 2px at 15% 60%, white, transparent),
        radial-gradient(2px 2px at 90% 70%, white, transparent);
    background-size: 280px 280px;
    opacity: .55;
    animation: sparkle 8s linear infinite;
    z-index: 0;
}

@keyframes sparkle {
    from { transform: translateY(0); }
    to { transform: translateY(-60px); }
}

/* ============ ĐOM ĐÓM BAY ============ */
.fireflies {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 1;
}

.firefly {
    position: absolute;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: #fff2c4;
    box-shadow:
        0 0 6px #fff2c4,
        0 0 12px #f5dfaa,
        0 0 20px #f5dfaa88;
    opacity: 0;
    animation: floatUp linear infinite;
}

@keyframes floatUp {
    0% {
        transform: translateY(100vh) translateX(0) scale(0.5);
        opacity: 0;
    }
    10% { opacity: 1; }
    50% {
        transform: translateY(50vh) translateX(30px) scale(1);
        opacity: 1;
    }
    90% { opacity: 1; }
    100% {
        transform: translateY(-10vh) translateX(-20px) scale(0.6);
        opacity: 0;
    }
}

/* ============ CÁNH HOA RƠI ============ */
.petals {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 1;
}

.petal {
    position: absolute;
    top: -30px;
    color: #f5dfaa;
    font-size: 18px;
    opacity: 0;
    animation: fall linear infinite;
    text-shadow: 0 0 8px #f5dfaa66;
}

@keyframes fall {
    0% {
        transform: translateY(-30px) translateX(0) rotate(0deg);
        opacity: 0;
    }
    10% { opacity: 0.9; }
    90% { opacity: 0.9; }
    100% {
        transform: translateY(105vh) translateX(80px) rotate(360deg);
        opacity: 0;
    }
}

/* ============ MÀN HÌNH INTRO ============ */
.intro {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 30px 20px;
    background:
        radial-gradient(ellipse 90% 70% at 50% 50%, #1c3a5e 0%, transparent 65%),
        radial-gradient(ellipse 60% 50% at 30% 30%, #2a4a6e 0%, transparent 55%),
        linear-gradient(160deg, #08152a 0%, #122845 45%, #0a1828 100%);
    transition: opacity 1s ease, visibility 1s ease, transform 1s ease, filter 1s ease;
    overflow: hidden;
}

/* VÒNG SÁNG SAU TIÊU ĐỀ */
.intro-glow {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: clamp(300px, 60vw, 600px);
    height: clamp(300px, 60vw, 600px);
    border-radius: 50%;
    background: radial-gradient(circle, rgba(245, 223, 170, 0.25) 0%, rgba(120, 180, 255, 0.1) 40%, transparent 70%);
    filter: blur(30px);
    animation: glowPulse 6s ease-in-out infinite;
    pointer-events: none;
    z-index: -1;
}

@keyframes glowPulse {
    0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.7; }
    50% { transform: translate(-50%, -50%) scale(1.15); opacity: 1; }
}

/* BOKEH - chấm sáng blur lớn ở 2 góc để lấp khoảng trống */
.intro-bokeh {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    z-index: 0;
    filter: blur(25px);
    animation: bokehFloat 12s ease-in-out infinite;
}

.intro-bokeh.b1 {
    top: 15%;
    left: 8%;
    width: 180px;
    height: 180px;
    background: radial-gradient(circle, rgba(120, 180, 255, 0.55), transparent 70%);
    animation-delay: 0s;
}

.intro-bokeh.b2 {
    bottom: 18%;
    right: 10%;
    width: 240px;
    height: 240px;
    background: radial-gradient(circle, rgba(245, 223, 170, 0.4), transparent 70%);
    animation-delay: -4s;
}

@keyframes bokehFloat {
    0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.8; }
    50% { transform: translate(20px, -15px) scale(1.15); opacity: 1; }
}

.intro.hidden {
    opacity: 0;
    visibility: hidden;
    transform: scale(1.08);
    filter: blur(8px);
}

/* Đảm bảo nội dung nằm trên các lớp nền */
.intro-label, .intro h1, .intro-subtitle, .intro-decor, .enter-btn, .intro-hint {
    position: relative;
    z-index: 2;
}

.intro-label {
    font-family: 'Cormorant Garamond', serif;
    font-size: 13px;
    letter-spacing: 8px;
    color: #c9dff6;
    margin-bottom: 22px;
    text-transform: uppercase;
    opacity: 0;
    animation: fadeIn 1.4s ease 0.2s forwards;
    position: relative;
}

.intro-label::before,
.intro-label::after {
    content: '';
    display: inline-block;
    width: 30px;
    height: 1px;
    background: #c9dff6;
    vertical-align: middle;
    margin: 0 14px;
    opacity: 0.6;
}

.intro h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(60px, 13vw, 120px);
    letter-spacing: 14px;
    color: #fff1c9;
    font-weight: 700;
    text-shadow: 0 0 25px #f5dca477;
    animation: glow 3s ease-in-out infinite alternate;
    position: relative;
}

/* Từng chữ tiêu đề xuất hiện */
.intro h1 .char {
    display: inline-block;
    opacity: 0;
    transform: translateY(40px) rotateX(-90deg);
    animation: charReveal 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
}

.intro h1 .char:nth-child(1) { animation-delay: 0.4s; }
.intro h1 .char:nth-child(2) { animation-delay: 0.55s; }
.intro h1 .char:nth-child(3) { animation-delay: 0.7s; }
.intro h1 .char:nth-child(4) { animation-delay: 0.85s; }

@keyframes charReveal {
    to {
        opacity: 1;
        transform: translateY(0) rotateX(0);
    }
}

.intro-subtitle {
    font-family: 'Dancing Script', cursive;
    font-size: clamp(22px, 4.5vw, 34px);
    color: #d8e8f7;
    margin-top: 16px;
    margin-bottom: 32px;
    min-height: 1.4em;
    opacity: 0;
    animation: fadeIn 0.5s ease 1.2s forwards;
}

.intro-subtitle .typed {
    border-right: 2px solid #f5dfaa;
    padding-right: 4px;
    animation: blink 0.8s step-end infinite;
}

@keyframes blink {
    50% { border-color: transparent; }
}

.intro-divider {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    margin-bottom: 42px;
    opacity: 0;
    animation: fadeIn 1.5s ease 2.6s forwards;
}

.intro-divider .line {
    width: 60px;
    height: 1px;
    background: linear-gradient(to right, transparent, #f5dfaa);
}

.intro-divider .line.right {
    background: linear-gradient(to left, transparent, #f5dfaa);
}

.intro-divider .heart {
    color: #f5dfaa;
    font-size: 15px;
    text-shadow: 0 0 10px #f5dfaa88;
    animation: heartbeat 1.8s ease-in-out infinite;
}

@keyframes heartbeat {
    0%, 100% { transform: scale(1); opacity: 0.85; }
    50% { transform: scale(1.3); opacity: 1; }
}

.enter-btn {
    padding: 16px 42px;
    border: 1px solid #f1dfb2;
    border-radius: 50px;
    background: linear-gradient(135deg, #f3dfb5, #d5b77c);
    color: #26354a;
    font-family: 'Cormorant Garamond', serif;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 3px;
    cursor: pointer;
    transition: all .3s ease;
    opacity: 0;
    animation: fadeInUp 1s ease 2.9s forwards, btnGlow 2.2s ease-in-out infinite 4s;
    box-shadow: 0 0 20px #f5dfaa44;
    position: relative;
    overflow: hidden;
}

/* Hiệu ứng sáng quét qua nút */
.enter-btn::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, #ffffff99, transparent);
    animation: shimmerBtn 3s ease-in-out infinite 4.5s;
}

@keyframes shimmerBtn {
    0% { left: -100%; }
    40%, 100% { left: 100%; }
}

@keyframes btnGlow {
    0%, 100% {
        box-shadow: 0 0 20px #f5dfaa44, 0 0 0 0 #f5dfaa33;
        transform: scale(1);
    }
    50% {
        box-shadow: 0 0 35px #f5dfaa99, 0 0 0 12px #f5dfaa00;
        transform: scale(1.04);
    }
}

.enter-btn:hover {
    transform: scale(1.08) translateY(-2px);
    box-shadow: 0 8px 40px #f5dfaacc, 0 0 0 4px #f5dfaa33;
}

.enter-btn:active {
    transform: scale(1.02);
}

.intro-hint {
    margin-top: 22px;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 14px;
    color: #8aa6c4;
    letter-spacing: 1px;
    opacity: 0;
    animation: fadeIn 1.5s ease 3.4s forwards, hintPulse 2.5s ease-in-out infinite 5s;
}

@keyframes hintPulse {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
}

/* ============ NỘI DUNG CHÍNH ============ */
.container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 1000px;
    min-height: 100vh;
    margin: auto;
    padding: 50px 20px 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    opacity: 0;
    transform: translateY(40px);
    filter: blur(12px);
    transition: opacity 1.2s ease, transform 1.2s ease, filter 1.2s ease;
}

.container.revealed {
    opacity: 1;
    transform: translateY(0);
    filter: blur(0);
}

.top-label {
    font-family: 'Cormorant Garamond', serif;
    font-size: 12px;
    letter-spacing: 7px;
    color: #c9dff6;
    margin-bottom: 18px;
    text-transform: uppercase;
}

h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(55px, 10vw, 90px);
    letter-spacing: 10px;
    color: #fff1c9;
    font-weight: 700;
    text-shadow: 0 0 25px #f5dca477;
    animation: glow 3s ease-in-out infinite alternate;
}

.subtitle {
    font-family: 'Dancing Script', cursive;
    font-size: clamp(20px, 4vw, 28px);
    color: #d8e8f7;
    margin-top: 12px;
    margin-bottom: 25px;
}

.divider {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    margin-bottom: 25px;
}

.divider .line {
    width: 60px;
    height: 1px;
    background: linear-gradient(to right, transparent, #f5dfaa);
}

.divider .line.right {
    background: linear-gradient(to left, transparent, #f5dfaa);
}

.divider .heart {
    color: #f5dfaa;
    font-size: 15px;
    text-shadow: 0 0 10px #f5dfaa88;
    animation: heartbeat 1.8s ease-in-out infinite;
}

/* ============ KHUNG VIDEO + LOADING ============ */
.video-frame {
    width: 100%;
    position: relative;
    padding: 8px;
    border: 1px solid #e6d6a7aa;
    border-radius: 20px;
    background: #ffffff12;
    box-shadow:
        0 0 25px #8ebde044,
        0 0 65px #f0dba622;
    backdrop-filter: blur(10px);
    overflow: hidden;
    aspect-ratio: 16 / 9;
    transform: scale(0.9);
    transition: transform 1s ease 0.5s, box-shadow 1s ease 0.5s;
}

.container.revealed .video-frame {
    transform: scale(1);
    box-shadow:
        0 0 35px #8ebde066,
        0 0 90px #f0dba633;
}

/* KHUNG LOADING ĐẸP - thay thế khung đen */
.loader {
    position: absolute;
    inset: 8px;
    border-radius: 13px;
    background:
        linear-gradient(110deg,
            #0a1a2e 0%,
            #0a1a2e 35%,
            #1d3a5a 50%,
            #0a1a2e 65%,
            #0a1a2e 100%);
    background-size: 250% 100%;
    animation: shimmer 2s linear infinite;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 3;
    transition: opacity .8s ease;
}

.loader.hidden {
    opacity: 0;
    pointer-events: none;
}

@keyframes shimmer {
    from { background-position: 250% 0; }
    to { background-position: -150% 0; }
}

/* VÒNG TRÒN XOAY + TIM ĐẬP */
.loader-orbit {
    position: relative;
    width: 70px;
    height: 70px;
    margin-bottom: 22px;
}

.loader-ring {
    position: absolute;
    inset: 0;
    border: 2px solid #f5dfaa22;
    border-top-color: #f5dfaa;
    border-right-color: #f5dfaa88;
    border-radius: 50%;
    animation: spin 1.1s linear infinite;
}

.loader-ring.inner {
    inset: 10px;
    border: 2px solid #c9dff622;
    border-bottom-color: #c9dff6;
    border-left-color: #c9dff688;
    animation: spin 0.9s linear infinite reverse;
}

.loader-heart {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    color: #f5dfaa;
    animation: heartbeat 1.2s ease-in-out infinite;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

@keyframes heartbeat {
    0%, 100% { transform: scale(1); opacity: .8; }
    50% { transform: scale(1.25); opacity: 1; }
}

.loader-text {
    font-family: 'Dancing Script', cursive;
    font-size: 24px;
    color: #f5dfaa;
    letter-spacing: 1px;
    animation: pulse-text 1.6s ease-in-out infinite;
}

.loader-dots {
    margin-top: 8px;
    color: #c9dff6;
    font-size: 15px;
    letter-spacing: 5px;
    font-family: 'Cormorant Garamond', serif;
    animation: dots-blink 1.4s ease-in-out infinite;
}

@keyframes pulse-text {
    0%, 100% { opacity: .65; }
    50% { opacity: 1; }
}

@keyframes dots-blink {
    0%, 100% { opacity: .4; }
    50% { opacity: 1; }
}

/* VIDEO */
video {
    width: 100%;
    height: 100%;
    display: block;
    border-radius: 13px;
    background: transparent;
    object-fit: cover;
    opacity: 0;
    transition: opacity 1s ease;
    position: relative;
    z-index: 2;
}

video.loaded {
    opacity: 1;
}

/* NÚT ÂM THANH / XEM LẠI */
.sound-btn {
    margin-top: 22px;
    padding: 13px 30px;
    border: 1px solid #f1dfb2;
    border-radius: 50px;
    background: linear-gradient(135deg, #f3dfb5, #d5b77c);
    color: #26354a;
    font-family: 'Cormorant Garamond', serif;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 2px;
    cursor: pointer;
    transition: .3s;
    display: none;
}

.sound-btn:hover {
    transform: scale(1.06);
    box-shadow: 0 0 25px #f5dfaa88;
}

/* FOOTER */
.footer {
    margin-top: 35px;
    color: #c7d9eb;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 17px;
    line-height: 2.1;
}

.footer span {
    color: #f1d9a2;
    font-family: 'Dancing Script', cursive;
    font-style: normal;
    font-size: 21px;
    display: inline-block;
    margin-top: 4px;
}

/* ANIMATION CHUNG */
@keyframes glow {
    from { text-shadow: 0 0 12px #fff2c466; }
    to { text-shadow: 0 0 35px #fff2c4bb; }
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

@keyframes fadeInUp {
    from { opacity: 0; transform: translateY(22px); }
    to { opacity: 1; transform: translateY(0); }
}

@keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.04); }
}

@media(max-width: 600px) {
    .container {
        padding: 40px 13px 25px;
    }
    .video-frame {
        padding: 5px;
        border-radius: 14px;
    }
    .decor, .intro-decor {
        margin-bottom: 18px;
    }
    .intro h1 {
        letter-spacing: 8px;
    }
}
</style>
</head>

<body>

<div class="stars"></div>
<div class="fireflies" id="fireflies"></div>
<div class="petals" id="petals"></div>

<!-- ============ MÀN HÌNH INTRO ============ -->
<div class="intro" id="intro">
    <div class="intro-glow"></div>
    <div class="intro-bokeh b1"></div>
    <div class="intro-bokeh b2"></div>
    <div class="intro-label">A Journey To Remember</div>
    <h1><span class="char">1</span><span class="char">2</span><span class="char">D</span><span class="char">1</span></h1>
    <p class="intro-subtitle"><span class="typed" id="typed"></span></p>
    <div class="intro-divider">
        <span class="line left"></span>
        <span class="heart">♡</span>
        <span class="line right"></span>
    </div>
    <button class="enter-btn" id="enterBtn">♡ VÀO KỶ NIỆM ♡</button>
    <div class="intro-hint">Chạm nhẹ – để thanh xuân vang lên ♡</div>
</div>

<!-- ============ NỘI DUNG CHÍNH ============ -->
<div class="container">

    <div class="top-label">A Journey To Remember</div>

    <h1>12D1</h1>

    <p class="subtitle">Thanh Xuân – Gửi Những Điều Đẹp Nhất...</p>

    <div class="divider">
        <span class="line left"></span>
        <span class="heart">♡</span>
        <span class="line right"></span>
    </div>

    <div class="video-frame">

        <!-- KHUNG LOADING ĐẸP -->
        <div class="loader" id="loader">
            <div class="loader-orbit">
                <div class="loader-ring"></div>
                <div class="loader-ring inner"></div>
                <div class="loader-heart">♡</div>
            </div>
            <div class="loader-text">Đang mở kỷ niệm...</div>
            <div class="loader-dots">• • •</div>
        </div>

        <video id="myVideo" playsinline preload="auto">
            <source src="12D1.mp4" type="video/mp4">
            Trình duyệt không hỗ trợ video.
        </video>

    </div>

    <button class="sound-btn" id="soundBtn">↻ XEM LẠI KỶ NIỆM</button>

    <div class="footer">
        Có những khoảnh khắc sẽ không bao giờ quay lại...<br>
        Nhưng ký ức về chúng sẽ mãi ở đây.<br>
        <span>♡ 12D1 – Một thời để nhớ ♡</span>
    </div>

</div>

<script>
const intro   = document.getElementById("intro");
const enterBtn = document.getElementById("enterBtn");
const video    = document.getElementById("myVideo");
const loader   = document.getElementById("loader");
const soundBtn = document.getElementById("soundBtn");

let videoReady = false;

// ============ TẠO ĐOM ĐÓM BAY ============
const firefliesContainer = document.getElementById("fireflies");
const NUM_FIREFLIES = 10;
for (let i = 0; i < NUM_FIREFLIES; i++) {
    const f = document.createElement("div");
    f.className = "firefly";
    f.style.left = Math.random() * 100 + "%";
    f.style.animationDuration = (8 + Math.random() * 7) + "s";
    f.style.animationDelay = (Math.random() * 10) + "s";
    f.style.width = f.style.height = (3 + Math.random() * 3) + "px";
    firefliesContainer.appendChild(f);
}

// ============ TẠO CÁNH HOA RƠI ============
const petalsContainer = document.getElementById("petals");
const petalChars = ["♡", "✦", "❀", "✿"];
const NUM_PETALS = 6;
for (let i = 0; i < NUM_PETALS; i++) {
    const p = document.createElement("div");
    p.className = "petal";
    p.textContent = petalChars[Math.floor(Math.random() * petalChars.length)];
    p.style.left = Math.random() * 100 + "%";
    p.style.animationDuration = (7 + Math.random() * 6) + "s";
    p.style.animationDelay = (Math.random() * 8) + "s";
    p.style.fontSize = (14 + Math.random() * 10) + "px";
    p.style.opacity = 0.5 + Math.random() * 0.4;
    petalsContainer.appendChild(p);
}

// ============ HIỆU ỨNG TYPEWRITER CHO SUBTITLE ============
const typedEl = document.getElementById("typed");
const typedText = "Thanh Xuân – Gửi Những Điều Đẹp Nhất";
let typedIndex = 0;
setTimeout(() => {
    const typeInterval = setInterval(() => {
        typedIndex++;
        typedEl.textContent = typedText.slice(0, typedIndex);
        if (typedIndex >= typedText.length) clearInterval(typeInterval);
    }, 70);
}, 1400);

// ẨN LOADER KHI VIDEO SẴN SÀNG
function showVideo() {
    if (videoReady) return;
    videoReady = true;
    loader.classList.add("hidden");
    video.classList.add("loaded");
}

video.addEventListener("loadeddata", showVideo);
video.addEventListener("canplay", showVideo);
video.addEventListener("playing", showVideo);

// Dự phòng: nếu sự kiện không kích, ẩn loader sau 9s
setTimeout(() => showVideo(), 9000);

// NẾU VIDEO LỖI (không có file), vẫn ẩn loader để khỏi kẹt
video.addEventListener("error", () => {
    setTimeout(() => showVideo(), 1500);
});

// ============ NÚT "VÀO KỶ NIỆM" ============
// Cú chạm này là "user gesture" → trình duyệt CHO PHÉP phát video CÓ TIẾNG
enterBtn.addEventListener("click", async () => {

    // Intro zoom + fade + blur ra
    intro.classList.add("hidden");
    setTimeout(() => { intro.style.display = "none"; }, 1000);

    // Container + video fade/scale/blur in mượt
    setTimeout(() => {
        document.querySelector(".container").classList.add("revealed");
    }, 250);

    // Phát video CÓ ÂM THANH (được phép vì user vừa chạm)
    try {
        video.muted = false;
        video.volume = 1;
        await video.play();
    } catch (e) {
        // Nếu vẫn bị chặn → phát không tiếng + hiện nút bật tiếng
        video.muted = true;
        try { await video.play(); } catch(err) {}

        soundBtn.style.display = "inline-block";
        soundBtn.textContent = "♫ BẬT ÂM THANH";
    }
});

// ============ NÚT BẬT ÂM THANH / XEM LẠI ============
soundBtn.addEventListener("click", async () => {

    // Nếu video đã kết thúc → xem lại
    if (video.ended) {
        video.currentTime = 0;
        video.muted = false;
        video.volume = 1;
        try {
            await video.play();
            soundBtn.style.display = "none";
        } catch(e) {
            video.muted = true;
            await video.play();
            soundBtn.textContent = "♫ BẬT ÂM THANH";
        }
        return;
    }

    // Nếu đang phát không tiếng → bật tiếng
    try {
        video.muted = false;
        video.volume = 1;
        if (video.paused) await video.play();
        soundBtn.style.display = "none";
    } catch (e) {
        soundBtn.textContent = "▶ CHẠM ĐỂ PHÁT VIDEO";
    }
});

// ============ KHI VIDEO KẾT THÚC ============
video.addEventListener("ended", () => {
    soundBtn.style.display = "inline-block";
    soundBtn.textContent = "↻ XEM LẠI KỶ NIỆM";
});
</script>
